<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Interactive maps for Warhammer 40,000: Darktide. Explore mission maps, main paths, and marker locations.">
		<meta property="og:type" content="website">
		<meta property="og:title" content="Warhammer 40,000: Darktide - Interactive Maps">
		<meta property="og:description" content="Interactive maps for Warhammer 40,000: Darktide. Explore mission maps, main paths, and marker locations.">
		<meta property="og:url" content="https://dtmaps.deluxghost.me/">
		<meta name="theme-color" content="#0d120f">
		<title>Warhammer 40,000: Darktide - Interactive Maps</title>
		<link rel="canonical" href="https://dtmaps.deluxghost.me/">
		<link rel="icon" type="image/webp" href="./icon.webp">
		<link rel="stylesheet" href="./styles.css">
	</head>
	<body>
		<div id="map"></div>
		<a class="support-link" href="https://ko-fi.com/deluxghost" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="supportMe" data-i18n-title="supportMe">
			<img src="https://storage.ko-fi.com/cdn/kofi5.png" alt="">
		</a>
		<section id="panel" class="panel">
			<header class="panel-header">
				<button id="panel-toggle" class="panel-toggle" type="button" aria-label="Toggle menu" aria-expanded="true" aria-controls="panel-content" data-i18n-aria-label="toggleMenu" data-i18n-title="toggleMenu">
					<i data-lucide="menu"></i>
				</button>
				<h1 class="panel-brand">
					<span class="panel-game-title" data-i18n="gameTitle">Warhammer 40,000: Darktide</span>
					<span data-i18n="menuTitle">Interactive Maps</span>
				</h1>
				<div class="panel-actions">
					<button id="settings-toggle" class="icon-button" type="button" data-i18n-aria-label="settings" data-i18n-title="settings" aria-haspopup="dialog" aria-controls="settings-dialog"><i data-lucide="settings"></i></button>
					<button id="about-toggle" class="icon-button" type="button" data-i18n-aria-label="about" data-i18n-title="about" aria-haspopup="dialog" aria-controls="about-dialog"><i data-lucide="info"></i></button>
				</div>
			</header>
			<hr class="panel-divider">
			<div id="panel-content" class="panel-content">
				<section class="map-selector">
					<h2 data-i18n="map">Map</h2>
					<select id="map-select" aria-label="Map" data-i18n-aria-label="map" data-i18n-title="tooltipSelectMap"></select>
				</section>
				<section class="filters">
					<h2 data-i18n="filters">Filters</h2>
					<div id="filter-list">
						<p class="muted" data-i18n="noMarkerCategories">No marker categories available.</p>
					</div>
				</section>
			</div>
		</section>
		<dialog id="settings-dialog" class="app-dialog settings-dialog" aria-labelledby="settings-title">
			<header class="dialog-header">
				<h2 id="settings-title" data-i18n="settings">Settings</h2>
				<button id="settings-close" class="icon-button" type="button" data-i18n-aria-label="dismiss" data-i18n-title="dismiss"><i data-lucide="x"></i></button>
			</header>
			<div class="settings-body">
				<div class="settings-group" data-settings-group="display">
					<div class="settings-option">
						<label for="language-select" data-i18n="language">Language</label>
						<select id="language-select"></select>
					</div>
				</div>
				<div class="settings-group" data-settings-group="debug" hidden>
					<div class="settings-option">
						<label for="debug-terrain-clipping" data-i18n="showTerrainClipping">Show terrain clipping</label>
						<input id="debug-terrain-clipping" type="checkbox">
					</div>
				</div>
			</div>
		</dialog>
		<dialog id="about-dialog" class="app-dialog about-dialog" aria-labelledby="about-title">
			<div class="about-fixed">
				<header class="dialog-header">
					<h2 id="about-title" data-i18n="appTitle">Warhammer 40,000: Darktide - Interactive Maps</h2>
					<button id="about-close" class="icon-button" type="button" data-i18n-aria-label="dismiss" data-i18n-title="dismiss"><i data-lucide="x"></i></button>
				</header>
				<div class="about-author">
					<a href="https://deluxghost.me/" target="_blank" rel="noopener noreferrer">deluxghost</a>
				</div>
			</div>
			<div class="about-body">
				<p data-i18n-html="aboutText"><a href="https://github.com/deluxghost/darktide-maps" target="_blank" rel="noopener noreferrer">Source code</a>. Inspired by <a href="https://mapgenie.io/" target="_blank" rel="noopener noreferrer">MapGenie</a> and <a href="https://github.com/funkthemonk" target="_blank" rel="noopener noreferrer">funkthemonk</a>'s navigation mesh experiments.</p>
				<h3 data-i18n="changelog">Changelog</h3>
				<div id="changelog-entries"></div>
			</div>
		</dialog>
		<div id="data-updated" class="data-updated" hidden></div>
		<div id="floor-control" class="floor-control" hidden></div>
		<div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden></div>
		<div id="marker-popup" class="marker-popup" hidden>
			<header class="marker-popup-header">
				<strong id="marker-popup-title"></strong>
				<button id="marker-popup-close" class="marker-popup-close" type="button" aria-label="Close" data-i18n-aria-label="dismiss" data-i18n-title="dismiss">
					<i data-lucide="x"></i>
				</button>
			</header>
			<small id="marker-popup-type"></small>
			<p id="marker-popup-description"></p>
		</div>
		<div id="marker-tooltip" class="marker-tooltip" hidden></div>
		<canvas id="auxiliary-arrow" class="auxiliary-arrow" aria-hidden="true"></canvas>
		<div id="notifications" class="notifications" aria-live="polite" aria-atomic="false"></div>
		<script type="module" src="./app.js"></script>
	</body>
</html>
