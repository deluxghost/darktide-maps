<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Darktide Maps</title>
		<link rel="stylesheet" href="./styles.css">
	</head>
	<body>
		<div id="map"></div>
		<section id="panel" class="panel">
			<header class="panel-header">
				<button id="panel-toggle" class="panel-toggle" type="button" aria-label="Toggle menu" aria-expanded="true" aria-controls="panel-content" data-i18n-aria-label="toggleMenu">
					<i data-lucide="menu"></i>
				</button>
				<h1 data-i18n="appTitle">Darktide Maps</h1>
			</header>
			<p id="help" class="help"></p>
			<div id="panel-content" class="panel-content">
				<section class="map-selector">
					<h2 data-i18n="map">Map</h2>
					<select id="map-select" aria-label="Map" data-i18n-aria-label="map"></select>
				</section>
				<section class="filters">
					<h2 data-i18n="filters">Filters</h2>
					<div id="filter-list">
						<p class="muted" data-i18n="noMarkerCategories">No marker categories available.</p>
					</div>
				</section>
			</div>
		</section>
		<div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden></div>
		<div id="marker-popup" class="marker-popup" hidden>
			<header class="marker-popup-header">
				<strong id="marker-popup-title"></strong>
				<button id="marker-popup-close" class="marker-popup-close" type="button" aria-label="Close" data-i18n-aria-label="dismiss">
					<i data-lucide="x"></i>
				</button>
			</header>
			<small id="marker-popup-type"></small>
			<p id="marker-popup-description"></p>
		</div>
		<div id="marker-tooltip" class="marker-tooltip" hidden></div>
		<div id="error-banner" class="error-banner" role="alert" hidden>
			<span id="error-message"></span>
			<button id="error-dismiss" class="error-dismiss" type="button" aria-label="Dismiss" data-i18n-aria-label="dismiss">
				<i data-lucide="x"></i>
			</button>
		</div>
		<script type="module" src="./app.js"></script>
	</body>
</html>
